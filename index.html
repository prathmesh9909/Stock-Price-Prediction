<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Stock Price Movement Predictor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-dark">

<div class="container py-5">

<div class="card shadow-lg">

<div class="card-body">

<h1 class="text-center text-primary">
📈 Stock Price Movement Predictor
</h1>

<p class="text-center text-muted">

Deep Learning using LSTM & PyTorch

</p>

<form action="/predict" method="POST">

<div class="mb-3">

<label class="form-label">
Enter Stock Symbol
</label>

<input
type="text"
class="form-control form-control-lg"
name="ticker"
placeholder="Example: AAPL, TSLA, TCS.NS"
required>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-lg">

Predict Stock

</button>

</div>

</form>

<hr>

<h5>Popular Stocks</h5>

<div>

<span class="badge bg-primary">AAPL</span>
<span class="badge bg-success">MSFT</span>
<span class="badge bg-danger">TSLA</span>
<span class="badge bg-warning text-dark">GOOGL</span>
<span class="badge bg-info text-dark">META</span>
<span class="badge bg-secondary">AMZN</span>
<span class="badge bg-dark">TCS.NS</span>
<span class="badge bg-dark">INFY.NS</span>
<span class="badge bg-dark">RELIANCE.NS</span>

</div>

</div>

</div>

</div>

</body>
</html>
